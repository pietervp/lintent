name: release

# A tag `v<version>` (matching Cargo.toml) builds the binaries, attaches them
# to a GitHub release and publishes the npm packages. Running the workflow by
# hand builds and packs everything and publishes nothing: a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-14 }
          - { target: x86_64-apple-darwin, runner: macos-14 }
          # glibc, not musl: runtime grammars are loaded with dlopen, which a
          # static musl binary cannot do. 22.04 keeps the glibc floor at 2.35.
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, exe: .exe }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name=lintent-${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/lintent${{ matrix.exe }}
          mkdir -p dist/${{ matrix.target }} "staging/$name"
          cp "$bin" dist/${{ matrix.target }}/
          cp "$bin" README.md LICENSE "staging/$name/"
          cp -R skills "staging/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            (cd staging && 7z a -tzip "../dist/$name.zip" "$name" >/dev/null)
          else
            tar -C staging -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: check the tag names the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum lintent-*.tar.gz lintent-*.zip > sha256sums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            lintent-*.tar.gz lintent-*.zip sha256sums.txt

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm accepts this workflow's OIDC token in place
      # of a stored npm token, and adds provenance on its own.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No cache in a job that publishes: a poisoned one would ship.
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - run: node npm/build.mjs artifacts npm-dist
      - name: smoke test the linux-x64 package
        run: |
          set -euo pipefail
          # Install packed tarballs, as the registry serves them: installing the
          # directories would symlink them, and the launcher would then resolve
          # the platform package from the wrong place.
          mkdir tgz smoke
          for dir in npm-dist/cli-linux-x64-gnu npm-dist/cli; do (cd "$dir" && npm pack --pack-destination ../../tgz); done
          cd smoke && npm init -y >/dev/null
          npm install ../tgz/*.tgz
          npx lintent --version
      - name: pack (dry run)
        if: github.ref_type != 'tag'
        run: for dir in npm-dist/*/; do (cd "$dir" && npm pack --dry-run); done
      - name: publish
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          publish() {
            local name version
            name=$(node -p "require('./$1/package.json').name")
            version=$(node -p "require('./$1/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              (cd "$1" && npm publish --access public)
            fi
          }
          for dir in npm-dist/cli-*/; do publish "$dir"; done
          # npm validates a new version before serving it, and an install
          # silently skips an optional dependency it cannot find. So
          # @lintent/cli goes out only once every platform package is served.
          for dir in npm-dist/cli-*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            for attempt in $(seq 1 120); do
              npm view "$name@$version" version >/dev/null 2>&1 && break
              [ "$attempt" = 120 ] && { echo "$name@$version is still not served after 30 minutes"; exit 1; }
              sleep 15
            done
            echo "$name@$version is served"
          done
          publish npm-dist/cli/

  nuget:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # nuget.org trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - run: packaging/nuget/pack.sh artifacts nupkg
      - name: smoke test the linux-x64 tool
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          cat > nuget.config <<XML
          <configuration><packageSources><clear /><add key="local" value="$GITHUB_WORKSPACE/nupkg" /></packageSources></configuration>
          XML
          dotnet new tool-manifest
          dotnet tool install lintent
          dotnet lintent --version
      - name: log in to nuget.org
        if: github.ref_type == 'tag'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: publish
        if: github.ref_type == 'tag'
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          push() {
            dotnet nuget push "$1" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
          rids="osx-arm64 osx-x64 linux-arm64 linux-x64 win-x64"
          for rid in $rids; do push "nupkg/lintent.$rid.$version.nupkg"; done
          # Installs fail while the pointer package is live and a RID package
          # is not, so `lintent` goes out once nuget.org serves all five. The
          # registration is what `dotnet tool install` resolves versions from,
          # and it lags the download feed by minutes.
          for rid in $rids; do
            for attempt in $(seq 1 120); do
              curl -sf "https://api.nuget.org/v3/registration5-gz-semver2/lintent.$rid/$version.json" >/dev/null && break
              [ "$attempt" = 120 ] && { echo "lintent.$rid $version is still not served after 30 minutes"; exit 1; }
              sleep 15
            done
            echo "lintent.$rid $version is served"
          done
          push "nupkg/lintent.$version.nupkg"

  crates:
    # After the GitHub release, so `cargo binstall` finds its archives.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: check whether this version is on crates.io
        id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl -sf -A "lintent release (github.com/pietervp/lintent)" \
              "https://crates.io/api/v1/crates/lintent/$version" >/dev/null; then
            echo "lintent $version is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.published != 'true'
        id: auth
      - if: steps.check.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: pietervp/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern sha256sums.txt
          mkdir -p tap/Formula
          packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" sha256sums.txt > tap/Formula/lintent.rb
      - name: push it to the tap
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lintent.rb
          git diff --cached --quiet && { echo "the formula is unchanged"; exit 0; }
          git commit -m "lintent ${GITHUB_REF_NAME#v}"
          git push
